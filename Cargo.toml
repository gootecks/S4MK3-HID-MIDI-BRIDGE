[package]
name = "s4mk3-hid-midi-bridge"
version = "0.2.1-beta.1"
edition = "2024"
rust-version = "1.88"
description = "Native Instruments S4 MK3 HID-to-MIDI bridge for Djay Pro on macOS"
publish = false
default-run = "s4mk3-hid-midi-bridge"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3"
encdr = { git = "https://github.com/gootecks/Encdr.git", rev = "89863020c79358ff496227501544eb1e6bbcbad6" }
hidapi = { version = "2.6", features = ["macos-shared-device"] }
midir = "0.11"
nusb = "0.2.3"
num-traits = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
core-foundation = "0.10"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
let_underscore_must_use = "deny"
assert_is_empty = "allow"
