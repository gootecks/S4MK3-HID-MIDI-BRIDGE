[tools]
age = "1.3.1"
communique = "1.5.0"
fnox = "1.43.0"
"github:jeduden/mdsmith" = "0.57.0"
hk = { version = "2.12.0", workflow = "release.yml" }
"github:oxc-project/oxc" = { version = "0.76.0", version_prefix = "oxfmt_v", rename_exe = "oxfmt" }
op = "2.32.1"
pkl = "0.32.1"
rust = { version = "1.99.1", profile = "default", components = ["rust-src"] }
shellcheck = "0.11.0"
shfmt = "3.14.1"
swiftformat = { version = "0.64.4", no_app = "true", rename_exe = "swiftformat" }
swiftlint = "0.65.1"

[env]
CARGO_NET_GIT_FETCH_WITH_CLI = "true"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks."lint:swift"]
description = "Run SwiftLint; violations not in the baseline fail"
run = "swiftlint lint --strict --quiet --no-cache --baseline .swiftlint-baseline.json"

[tasks."lint:swift:baseline"]
description = "Rewrite the SwiftLint baseline after deliberately accepting violations"
run = [
  "swiftlint lint --quiet --no-cache --write-baseline .swiftlint-baseline.json > /dev/null || test -s .swiftlint-baseline.json",
  "swiftlint lint --strict --quiet --no-cache --baseline .swiftlint-baseline.json",
]

[tasks.build]
description = "Build all Rust targets"
run = "cargo build --locked --all-targets"

[tasks."test:rust"]
description = "Run Rust tests"
run = "cargo test --locked"

[tasks."test:swift"]
description = "Run macOS app tests"
run = "swift test --package-path macos"

[tasks.test]
description = "Run Rust and Swift tests"
depends = ["test:rust", "test:swift"]

[tasks.check]
description = "Run read-only hk checks on all files"
run = "hk check --all --check --no-fail-fast"

[tasks.ci]
description = "Run every AGENTS.md gate: hk checks, build and tests"
depends = ["check", "build", "test"]

[tasks."app:build"]
description = "Build the portable app bundle, zip and dmg into dist/"
run = "bash macos/build-app.sh"

[tasks."app:verify"]
description = "Verify the packaged app signature, zip and dmg"
run = """
set -eu
version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
codesign --verify --deep --strict "dist/S4 MK3 Bridge.app"
unzip -tq "dist/S4 MK3 Bridge-arm64.zip"
hdiutil verify "dist/S4 MK3 Bridge-$version-arm64.dmg"
"""

[tasks."s8:agent-stop"]
description = "Attended S8 screen phase 0: stop NIHardwareAgent, check MIDI, restore (#32)"
run = "bash docs/s8/agent-stop-check.sh"
raw = true

[tasks."s8:screen-claim"]
description = "Attended S8 screen phase 1: stop NIHardwareAgent, claim interface 6 for 5 s, restore (#33)"
run = "bash docs/s8/screen-claim-check.sh"
raw = true

[tasks."s8:screen-frame"]
description = "Attended S8 screen phases 2 and 4: stop NIHardwareAgent, send single frames, restore (#34, #35)"
usage = '''
arg "<phase>" help="first (phase 2) or pattern (phase 4)"
arg "[order]" help="pattern colour order: rgb or bgr"
'''
run = 'bash docs/s8/screen-frame-check.sh "$usage_phase" ${usage_order:-}'
raw = true

[tasks."s8:screen-stream"]
description = "Attended S8 screen phase 5: stop NIHardwareAgent, stream frames, partial updates, exit state, restore (#43)"
run = "bash docs/s8/screen-stream-check.sh"
raw = true

[tasks."s8:phase5-images"]
description = "Regenerate the expected phase 5 panel pictures, or `check` them against the tool (#43); sends nothing"
usage = '''
arg "[mode]" help="check to compare instead of writing"
'''
run = 'bash docs/s8/phase5-images.sh ${usage_mode:-}'

[tasks."s8:transport-images"]
description = "Regenerate the expected screen transport pictures, or `check` them against the tool (#44); sends nothing"
usage = '''
arg "[mode]" help="check to compare instead of writing"
'''
run = 'bash docs/s8/transport-images.sh ${usage_mode:-}'

[tasks."s8:screen-transport"]
description = "Attended S8 screen transport check: stop NIHardwareAgent, feed frames through --s8-screens-stdin, restore (#44)"
run = "bash docs/s8/screen-transport-check.sh"
raw = true

[tasks."s8:deck-page"]
description = "Attended S8 deck page check: stop NIHardwareAgent, stream the live djay deck pages to the panels, restore (#85)"
usage = '''
arg "[from]" help="step to start from (default a-paused)"
'''
run = 'bash docs/s8/deck-page-check.sh ${usage_from:-}'
raw = true

[tasks."s8:display-buttons"]
description = "Attended S8 display button and screen encoder check: stop NIHardwareAgent, run S8Host against Djay, restore (#51); sends nothing to the S8"
run = "bash docs/s8/display-buttons-check.sh"
raw = true

[tasks."s8:panel-views-images"]
description = "Regenerate the expected panel view pictures, or `check` them against the tools (#27); sends nothing"
usage = '''
arg "[mode]" help="check to compare instead of writing"
'''
run = 'bash docs/s8/panel-views-images.sh ${usage_mode:-}'

[tasks."s8:panel-views"]
description = "Attended S8 panel views check: stop NIHardwareAgent, run S8Host --screens against Djay, restore (#27); sends screen frames to the S8"
run = "bash docs/s8/panel-views-check.sh"
raw = true

[tasks."s8:deck-data"]
description = "Attended S8 deck data check: stop NIHardwareAgent, show the live djay decks on the panels through S8Preview --stream and S8Host, restore (#45); sends screen frames to the S8"
run = "bash docs/s8/deck-data-check.sh"
raw = true

[tasks."s8:input-capture"]
description = "Attended S8 input capture: stop NIHardwareAgent, walk the control checklist, restore (#10)"
usage = '''
arg "[from]" help="checklist row to start from (default 1)"
'''
run = 'bash docs/s8/input-capture-session.sh ${usage_from:-}'
raw = true

[tasks."s8:raw"]
description = "Read-only S8 decode: log every control change from interface 5, send nothing (#12)"
usage = '''
arg "[seconds]" help="how long to read (default 30)"
'''
run = 'cargo run --locked -- --device s8 --raw --seconds ${usage_seconds:-30}'

[tasks."s8:midi"]
description = "Attended S8 translator check: stop NIHardwareAgent, run --midi full until Ctrl-C, restore (#15)"
run = "bash docs/s8/translator-check.sh"
raw = true

[tasks."hooks:install"]
description = "Install hk Git hooks and the mdsmith merge driver"
run = [
  "hk install",
  "git config merge.mdsmith.name 'mdsmith section-aware Markdown merge'",
  '''git config merge.mdsmith.driver "'$(command -v mdsmith)' merge-driver run %O %A %B %P"''',
  "mdsmith pre-merge-commit install",
]

[tasks."secrets:check"]
description = "Validate configured secrets"
run = "fnox -c fnox.toml check"

[tasks."secrets:sync"]
description = "Cache 1Password secrets locally with age encryption"
run = "fnox -c fnox.toml sync --local-file -p age -s onepass -f"

[tasks."release:notes"]
description = "Preview release notes without publishing or writing files"
usage = '''
arg "[tag]" default="HEAD" help="Target ref"
arg "[previous]" help="Previous ref"
'''
run = """
tag="${usage_tag:-HEAD}"
previous="${usage_previous:-}"
set -- "$tag"
if [ -n "$previous" ]; then set -- "$@" "$previous"; fi
fnox -c fnox.toml exec -- bash -c 'export OPENAI_API_KEY="${LLM_GATEWAY:?missing gateway token}"; exec communique "$@"' -- generate "$@" --dry-run
"""

[tasks."changelog:preview"]
description = "Preview a concise changelog entry without writing or publishing"
usage = '''
arg "[tag]" default="HEAD" help="Target ref"
arg "[previous]" help="Previous ref"
'''
run = """
tag="${usage_tag:-HEAD}"
previous="${usage_previous:-}"
set -- "$tag"
if [ -n "$previous" ]; then set -- "$@" "$previous"; fi
fnox -c fnox.toml exec -- bash -c 'export OPENAI_API_KEY="${LLM_GATEWAY:?missing gateway token}"; exec communique "$@"' -- generate "$@" --dry-run --changelog --concise
"""

[tasks."changelog:update"]
description = "Write a concise changelog entry to CHANGELOG.md without publishing"
usage = '''
arg "[tag]" default="HEAD" help="Target ref"
arg "[previous]" help="Previous ref"
'''
run = """
tag="${usage_tag:-HEAD}"
previous="${usage_previous:-}"
set -- "$tag"
if [ -n "$previous" ]; then set -- "$@" "$previous"; fi
fnox -c fnox.toml exec -- bash -c 'export OPENAI_API_KEY="${LLM_GATEWAY:?missing gateway token}"; exec communique "$@"' -- generate "$@" --changelog --concise
"""

[tasks."release:publish"]
description = "Update notes on an existing GitHub release for a real tag"
usage = '''
arg "<tag>" help="Existing release tag"
arg "[previous]" help="Previous ref"
'''
run = """
set -eu
tag="${usage_tag:?missing release tag}"
previous="${usage_previous:-}"
if ! git show-ref --verify --quiet "refs/tags/$tag"; then
  printf '%s\\n' "A real local release tag is required: $tag" >&2
  exit 1
fi
set -- "$tag"
if [ -n "$previous" ]; then set -- "$@" "$previous"; fi
fnox -c fnox.toml exec -- bash -c '
set -eu
export OPENAI_API_KEY="${LLM_GATEWAY:?missing gateway token}"
if [ -z "${GITHUB_TOKEN:-}" ]; then
  GITHUB_TOKEN="$(gh auth token --hostname github.com --user gootecks)"
fi
if [ -z "$GITHUB_TOKEN" ]; then
  printf "%s\\n" "GitHub authentication returned an empty token." >&2
  exit 1
fi
export GITHUB_TOKEN
GH_TOKEN="$GITHUB_TOKEN" gh release view "$2" --repo gootecks/S4MK3-HID-MIDI-BRIDGE > /dev/null
exec communique "$@"
' -- generate "$@" --github-release
"""
