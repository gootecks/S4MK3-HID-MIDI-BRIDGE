  # END upstream files
# Every rule applies to every fork-owned file, with one exception: GitHub shows front
# matter as a table above a README, and the root README.md is the project's front page.
# A pattern without a slash matches the file name in every folder, so front matter is
# required by a pattern that only files in a folder match.
overrides:
  - glob: ["*/**/*.md"]
    rules:
      required-frontmatter:
        fields: [summary, type]
rules:
  # oxfmt always leaves a blank line after front matter; MDS004 rejects it.
  first-line-heading: false
  line-length:
    max: 95
    stern: true
  required-frontmatter: false
  paragraph-readability: true
  paragraph-structure: true
  code-block-style:
    style: consistent
  proper-names:
    names: [GitHub, macOS, Xcode, AppKit, SwiftUI, Traktor, Rust, Swift]
  list-indent: true
  table-format: true
  no-duplicate-headings: true
  table-readability: true
  max-file-length:
    max: 500
  token-budget: true
  single-h1: true
  no-space-in-code-spans: true
  no-space-in-link-text: true
  horizontal-rule-style: true
  ordered-list-numbering: true
  ambiguous-emphasis: true
  descriptive-link-text: true
  duplicated-content: true
  link-style: true
  over-repetition: true
