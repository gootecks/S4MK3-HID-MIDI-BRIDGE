convention: github
files:
  - "docs/s8/**/*.md"
ignore:
  - "**/*.md"
  - "!docs/s8/**/*.md"
rules:
  # oxfmt always leaves a blank line after front matter; MDS004 rejects it.
  first-line-heading: false
  line-length:
    max: 95
    stern: true
  code-block-style:
    style: consistent
  required-frontmatter:
    fields: [summary, type]
  proper-names:
    names: [GitHub, macOS, Xcode, AppKit, SwiftUI, Traktor, Rust, Swift]
  list-indent: true
  table-format: true
  no-duplicate-headings: true
  paragraph-readability: true
  paragraph-structure: true
  table-readability: true
  max-file-length:
    max: 500
  token-budget: true
  single-h1: true
  no-space-in-code-spans: true
  no-space-in-link-text: true
  horizontal-rule-style: true
  ordered-list-numbering: true
  ambiguous-emphasis: true
  descriptive-link-text: true
  duplicated-content: true
  link-style: true
  over-repetition: true
