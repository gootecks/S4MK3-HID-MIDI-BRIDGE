convention: github
files:
  - "**/*.md"
# Every Markdown file that is not upstream's is linted. The block below is written by
# docs/s8/upstream-files.sh. CHANGELOG.md is formatted by oxfmt only; plans/ is local
# and excluded in .git/info/exclude, which mdsmith does not read.
ignore:
